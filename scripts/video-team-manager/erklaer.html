          opacity:0; transform:translateY(-26px) scale(.96); transition: all .45s cubic-bezier(.2,1.4,.4,1); }

<body><div id="stage"></div>
<script>
const HOCH = location.hash === '#hoch';
if (HOCH) document.body.classList.add('hoch');
const LOGO = '../../public/mdu-logo.webp';
const S = 'shots/';
const W = 1920, H = HOCH ? 1920 : 1080;

// ── Bausteine ──
const titel = (t) => `<div class="titel"><img src="${LOGO}"><div class="t">${t}</div></div>`;

      <div class="oder tc" data-k="0" data-bis="2" style="${HOCH ? 'left:70px;right:70px;top:1000px;text-align:center;background:rgba(10,26,16,.96)' : 'left:700px;right:540px;top:330px;text-align:center;background:rgba(10,26,16,.96)'}">Keine Pflicht<br><span style="font-size:${HOCH ? 34 : 30}px;font-family:Manrope;font-weight:700">Alles läuft auch ohne – wie bisher</span></div>
      ${stempel(1, 'Euer Team im Griff! 🎯', 700, 720, 'gold', 120, 1380, 2)}
      <div class="gratis tc" data-k="2" style="${HOCH ? 'left:90px;top:720px' : 'left:700px;top:80px'}">14 Tage gratis testen</div>
      <div class="weg-zu" data-k="2" style="${HOCH ? 'left:60px;right:60px;top:1000px;flex-direction:column;align-items:center' : 'left:840px;top:330px;flex-direction:column;align-items:flex-start;gap:4px;font-size:38px'}"><span>mdudarts.de</span><i>→</i><span>Mein Bereich</span><i>→</i><span>Team Manager</span></div>
      ${stempel(3, 'Merci & bis bald! 👋', 760, 800, 'gold', 260, 1500)}
    </div>`,
    schritte: [
      { s: 3.6, u: 'Und nochmal: Es ist keine Pflicht – alles läuft auch ohne, wie bisher!', k: 1 },
      { s: 4.4, u: 'Aber mit Team Manager habt ihr euer Team im Griff, und jeder weiß immer Bescheid, was gerade läuft.', k: 2 },
      { s: 5.6, u: 'Egal wie ihr euch am Ende entscheidet: Geht jetzt auf Mein Bereich, Team Manager, und probiert es unverbindlich 14 Tage kostenlos aus!', k: 3 },
      { s: 3.2, u: '[excited] Auf geht’s – und merci euch fürs Zuhören. Bis bald!', k: 4 } ] },
];

// ── Ablauf ────────────────────────────────────────────────
const stage = document.getElementById('stage');
stage.innerHTML = SZENEN.map((sz, i) => `<div class="szene" id="sz${i}">${sz.titel ? titel(sz.titel) : ''}${sz.html}</div>`).join('')
  + `<div class="unter" id="unter"></div><div class="fortschritt" id="fort" style="width:0"></div>`;
// Collage aus allen Shots (Szene „Und was kostet der Spaß?“)
const COLLAGE = ['dash-n9', 'dash-grund', 'spiel-kader-tc', 'spiel-offen', 'glocke', 'spiel-aufstellung', 'bericht-voll', 'spiel-notiz', 'kasse-strafe', 'kasse-offen',
  'spiel-erinnern', 'gegner', 'nachricht', 'termine', 'termin-neu', 'kalender', 'stat', 'stat-teilnahme', 'spiel-teilen', 'glocke-tim'];
document.getElementById('collage').innerHTML = COLLAGE.slice(0, HOCH ? 12 : 20).map((n, i) => `<div data-c="${i}" style="background-image:url(${S}${HOCH ? 'handy' : 'web'}-${n}.jpg)"></div>`).join('');

const warte = ms => new Promise(r => setTimeout(r, ms));
// Untertitel: Regieanweisungen fürs Sprachmodell ([excited] …) weg, {S***|Sack} zeigt S*** (gesprochen wird „Sack“, darüber ein Piep).
const ohneRegie = (u) => u.replace(/\[[^\]]*\]\s*/g, '').replace(/\{([^|}]*)\|[^}]*\}/g, '$1');
// Taktstreifen UNTER dem Bild (vertonen.js nimmt 12 px mehr auf und schneidet sie ab): schaltet bei
// jedem Satz schwarz/weiß. So liest vertonen.js aus dem Video, wann ein Satz WIRKLICH im Bild beginnt —
// die Aufnahme des Browsers läuft langsamer als die Uhr (2026-10-27: 8 s auf 4 Minuten).
const takt = document.createElement('div');
takt.style.cssText = `position:fixed;left:0;width:100%;top:${H}px;height:12px;background:#000;z-index:99`;
document.documentElement.appendChild(takt);
window.TAKT = [];
const taktSchalten = () => { takt.style.background = window.TAKT.length % 2 ? '#000' : '#fff'; window.TAKT.push(Date.now() - (window.START_EPOCH ?? Date.now())); };
// Soundeffekte: was neu sichtbar wird, meldet sich mit Art und Zeit (vertonen.js legt den Klang darunter)
window.EFFEKTE = [];
// Dasselbe Ereignis in Laptop UND Handy klingt einmal; mehrere Pushes zugleich (drei Handys) gestaffelt.
const fx = (typ) => {
  if (!window.START_EPOCH) return;
  const ms = Date.now() - window.START_EPOCH, gleich = window.EFFEKTE.filter(e => e.typ === typ && ms - e.roh < 80);
  if (gleich.length && typ !== 'ding') return;
  window.EFFEKTE.push({ typ, roh: ms, ms: ms + gleich.length * 220 });
};
const fxArt = (e) => e.matches('.push') ? 'ding' : e.matches('.strich') ? 'kratz' : e.matches('.vgl') && e.querySelector('.em')?.textContent.includes('🥃') ? 'klirr'
  : e.matches('.preisgross') ? 'kasse' : e.matches('.gratis') ? 'tada' : e.matches('.m, .stempel, .vorschau, .app, .vgl, .oder, .frage') ? 'plopp' : null;
// Untertitel: der Satz, der gesprochen wird; „weiter“-Schritte wechseln nur das Bild.
SZENEN.forEach(sz => { let letzter = ''; sz.schritte.forEach(x => { if (x.weiter) x.u = x.u ?? letzter; letzter = x.u; }); });

function zeige(el, x) {
  const k = x.k ?? 0;
  el.querySelectorAll('[data-k]').forEach(e => {
    const an = Number(e.dataset.k) < k && (e.dataset.bis === undefined || k <= Number(e.dataset.bis));
    if (an && !e.classList.contains('an')) { const t = fxArt(e); if (t) fx(t); }
    e.classList.toggle('an', an);
  });
  el.querySelectorAll('.tausch').forEach(e => { e.style.opacity = e.classList.contains('an') ? 1 : 0; });
  if (x.b !== undefined) el.querySelectorAll('img[data-b]').forEach(img => {
    const an = Number(img.dataset.b) === x.b;
    img.classList.toggle('an', an);
    if (img.closest('.laptop')) img.style.transform = x.z ? `scale(${x.z[2]})` : 'none', img.style.transformOrigin = x.z ? `${x.z[0]}% ${x.z[1]}%` : '50% 0';
  });
  if (x.intro === 'titel') el.querySelector('.intro')?.classList.add('titel-da');
  if (x.intro === 'weg') el.querySelector('.intro')?.classList.add('weg');
}

window.DAUER = SZENEN.reduce((a, s) => a + s.schritte.reduce((b, x) => b + x.s, 0) + 0.45, 0);
// window.ZEITEN[i][j] = Dauer des GESPROCHENEN Satzes j (vertonen.js zählt nur Sätze mit eigenem Text).
window.SPIEL = async () => {
  const vor = window.VORLAUF ?? 0.45;
  if (window.ZEITEN) SZENEN.forEach((sz, i) => {
    // gesprochene Sätze = Schritte ohne `weiter`; ein `weiter`-Schritt nimmt sich seinen Anteil vom vorigen Satz
    let j = -1; const gruppen = [];
    sz.schritte.forEach(x => { if (!x.weiter) { j++; gruppen[j] = [x]; } else gruppen[j].push(x); });
    gruppen.forEach((g, n) => {
      const ziel = window.ZEITEN[i]?.[n]; if (!ziel) return;
      const summe = g.reduce((a, x) => a + x.s, 0);
      g.forEach(x => { x.s = x.s / summe * ziel; });
    });
  });
  const summe = SZENEN.reduce((a, s) => a + s.schritte.reduce((b, x) => b + x.s, 0) + vor, 0);
  window.DAUER = summe; window.MARKEN = []; window.EFFEKTE = []; window.TAKT = []; window.START_EPOCH = Date.now(); taktSchalten();
  let vergangen = 0;
  for (let i = 0; i < SZENEN.length; i++) {
    const el = document.getElementById('sz' + i);
    document.querySelectorAll('.szene').forEach(x => x.classList.remove('an'));
    el.classList.add('an');
    if (i > 0) fx('whoosh');
    zeige(el, { ...SZENEN[i].schritte[0], k: 0 });
    await warte(vor * 1000); vergangen += vor;
    let satz = -1;
    for (let j = 0; j < SZENEN[i].schritte.length; j++) {
      const sch = SZENEN[i].schritte[j];
      if (!sch.weiter) { satz++; window.MARKEN.push({ i, j: satz, ms: Date.now() - window.START_EPOCH }); taktSchalten(); }
      document.getElementById('unter').textContent = ohneRegie(sch.u ?? '');
      zeige(el, sch);
      if (sch.collage) el.querySelectorAll('[data-c]').forEach((c, n) => setTimeout(() => c.classList.add('an'), n * 70));
      el.querySelector('.frage span')?.classList.toggle('trommel', !!sch.trommel);
      if (sch.trommel) fx('trommel');
      if (sch.intro === 'titel') fx('whoosh');
      document.getElementById('fort').style.width = (vergangen / summe * 100) + '%';
      await warte(sch.s * 1000); vergangen += sch.s;
    }
  }
  document.getElementById('fort').style.width = '100%';
  taktSchalten();
  window.FERTIG = true;
};
</script></body></html>
