name: Import dartunion.de match data

# Runs daily at 11:10 UTC (= 13:10 MESZ/Sommerzeit, 12:10 MEZ/Winterzeit).
# GitHub-Cron laeuft in UTC und kennt keine Sommer-/Winterzeit-Umstellung.
# Can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: '10 11 * * *'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated JSON file

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run import script
        run: npm run import:dartunion

      - name: Commit updated data (if changed)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add lib/data/imported-matches.json \
                  lib/data/imported-standings.json \
                  lib/data/imported-statistics.json
          git diff --staged --quiet && echo "No changes." || \
            git commit -m "chore: update imported match/standings/statistics data from dartunion.de [skip ci]"

      - name: Push
        run: git push
