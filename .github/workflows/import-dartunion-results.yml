name: Import dartunion.de match data

# PAUSIERT (Saison 2025/2026 beendet, finaler Stand manuell eingefroren am 2026-07-06):
# Der taegliche Cron ist deaktiviert, damit die manuell gesetzten Endergebnisse
# (Silberpfeile II 18:0 Jolly Pirates V / Fuenf-Sterne-Boazn 8:10 Wild Indians C-MD20)
# + C-Liga-Tabelle/Einzelrangliste nicht ueberschrieben werden.
# Zum Reaktivieren fuer die naechste Saison: schedule-Block wieder einkommentieren.
# Manuell ausloesbar bleibt der Import jederzeit ueber "workflow_dispatch" (Actions-Tab).
on:
  # schedule:
  #   - cron: '10 11 * * *'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated JSON file

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run import script
        run: npm run import:dartunion

      - name: Commit updated data (if changed)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add lib/data/imported-matches.json \
                  lib/data/imported-standings.json \
                  lib/data/imported-statistics.json
          git diff --staged --quiet && echo "No changes." || \
            git commit -m "chore: update imported match/standings/statistics data from dartunion.de [skip ci]"

      - name: Push
        run: git push
