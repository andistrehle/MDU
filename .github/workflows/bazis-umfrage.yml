name: Bazis · Ankunfts-Umfrage (WhatsApp)

# An jedem Spieltag der Freibad Bazis um 11 Uhr eine Umfrage in die
# WhatsApp-Gruppe: ab 1,5 h vor Beginn alle 15 Minuten, mit Sprüchen, dazu
# „Mitfahrt“ und „Bin raus“ (scripts/whatsapp-bot/). INOFFIZIELL über ein
# verknüpftes Gerät — vom Betreiber bewusst so gewählt (23.10.2026).
#
# Läuft viermal am Vormittag (09:17/09:47/10:17/10:47 UTC): Cron kennt keine
# Zeitumstellung, und GitHub startet zeitgesteuerte Läufe oft verspätet oder lässt
# sie bei Last ganz aus (am 23.10.2026 kam der 09:05-Lauf nicht). Der Bot postet
# erst ab 11:00 Münchner Zeit und nur EINMAL je Tag — die übrigen Läufe tun nichts.
# Ohne Spiel heute meldet er sich gar nicht erst bei WhatsApp an.
#
# Das Repo ist öffentlich: Die Anmeldung liegt NUR verschlüsselt im Cache der
# Actions (Schlüssel = Geheimnis WA_SCHLUESSEL), das Protokoll nennt weder
# Gruppe noch Nummer. Geheimnisse: WA_SCHLUESSEL, WA_GRUPPE, WA_NUMMER, WA_SITZUNG
# (verschlüsselte Anmeldung vom eigenen Rechner, `node bot.mjs anmelden-lokal` — der Weg,
# wenn WhatsApp das Koppeln von GitHub aus ablehnt).
#
# Von Hand (Actions → dieser Workflow → Run workflow):
#   anmelden — einmalig: Kopplungscode im Protokoll, in WhatsApp eingeben
#   anmelden-qr — wie anmelden, aber per QR-Code (Protokoll am Laptop öffnen, mit dem Handy scannen)
#   test     — Umfrage fürs nächste Spiel an dich selbst schicken
#   umfrage  — wie der tägliche Lauf
#   signal-umfrage — die heutige Umfrage NUR per Signal an SIGNAL_EMPFAENGER (Test)
# SIGNAL (Betreiber 13.11.2026): Mit Geheimnis SIGNAL_EMPFAENGER (+ einmal „signal-anmelden“ im
# Live-Workflow) geht die Umfrage zusätzlich per Signal an diese EINE Person.
on:
  schedule:
    - cron: '17 9 * * *'
    - cron: '47 9 * * *'
    - cron: '17 10 * * *'
    - cron: '47 10 * * *'
  workflow_dispatch:
    inputs:
      modus:
        description: 'Was soll der Bot tun?'
        type: choice
        options: [anmelden, anmelden-qr, test, umfrage, signal-umfrage]
        default: anmelden

concurrency:
  group: bazis-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODUS: ${{ inputs.modus || 'umfrage' }}
      SIGNAL_EMPFAENGER: ${{ secrets.SIGNAL_EMPFAENGER }}
      WA_GRUPPE_SPIEGEL: ${{ secrets.WA_GRUPPE_SPIEGEL }}
    steps:
      - name: Auf laufenden Spiegel-Lauf warten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bazis-spiegel.yml/runs?status=in_progress&per_page=1" | jq '.total_count' || echo 0)
            [ "${n:-0}" = "0" ] && exit 0
            echo "Spiegel-Lauf aktiv – warte 10 s"; sleep 10
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Umfrage aus dem Spielplan bauen
        run: |
          if [ "$MODUS" = "test" ]; then ARG=--naechstes; else ARG=; fi
          npx --yes tsx@4 scripts/whatsapp-bot/umfrage.ts $ARG > scripts/whatsapp-bot/umfrage.json
          echo "Spiel: $(node -e "const u=require('./scripts/whatsapp-bot/umfrage.json'); console.log(u ? u.datum + ' ' + u.uhrzeit : 'keins')")"

      - name: Gespeicherte Anmeldung holen
        uses: actions/cache/restore@v4
        with:
          path: scripts/whatsapp-bot/sitzung
          key: wa-sitzung-none
          restore-keys: wa-sitzung-

      - name: Signal-Anmeldung (verschlüsselt) holen
        uses: actions/cache/restore@v4
        with:
          path: scripts/whatsapp-bot/signal
          key: signal-sitzung-none
          restore-keys: signal-sitzung-

      - name: signal-cli installieren (nur wenn Signal eingerichtet)
        if: env.SIGNAL_EMPFAENGER != ''
        continue-on-error: true
        run: |
          url=$(curl -fsSL https://api.github.com/repos/AsamK/signal-cli/releases/latest | jq -r '.assets[] | select(.name | test("Linux-native\\.tar\\.gz$")) | .browser_download_url' | head -1)
          echo "signal-cli: $url"
          mkdir -p "$RUNNER_TEMP/signal-cli" && curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP/signal-cli"
          bin=$(find "$RUNNER_TEMP/signal-cli" -type f -name signal-cli | head -1) && chmod +x "$bin"
          echo "SIGNAL_CLI=$bin" >> "$GITHUB_ENV" && "$bin" --version

      - name: Bot-Abhängigkeiten
        working-directory: scripts/whatsapp-bot
        run: npm ci --no-audit --no-fund

      - name: Bot
        working-directory: scripts/whatsapp-bot
        env:
          WA_SCHLUESSEL: ${{ secrets.WA_SCHLUESSEL }}
          WA_GRUPPE: ${{ secrets.WA_GRUPPE }}
          WA_NUMMER: ${{ secrets.WA_NUMMER }}
          WA_SITZUNG: ${{ secrets.WA_SITZUNG }}
        run: node bot.mjs "$MODUS"

      - name: Anmeldung (verschlüsselt) sichern
        if: always() && hashFiles('scripts/whatsapp-bot/sitzung/sitzung.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: scripts/whatsapp-bot/sitzung
          key: wa-sitzung-${{ hashFiles('scripts/whatsapp-bot/sitzung/sitzung.enc') }}

      - name: Signal-Anmeldung (verschlüsselt) sichern
        if: always() && hashFiles('scripts/whatsapp-bot/signal/signal.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: scripts/whatsapp-bot/signal
          key: signal-sitzung-${{ hashFiles('scripts/whatsapp-bot/signal/signal.enc') }}
