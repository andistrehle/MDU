name: Bazis · Live-Ticker (WhatsApp)

# Während eines Spiels der Freibad Bazis schreibt der Bot nach JEDEM neuen Ergebnis
# eine Nachricht in die Live-Gruppe (Geheimnis WA_GRUPPE_LIVE — eine ANDERE Gruppe als
# die Umfrage), zum Schluss den Endstand. Quelle ist der öffentliche Live-Ticker
# (/api/live), also nur, was live im Spielbericht eingetragen wird.
# INOFFIZIELL wie die Umfrage (scripts/whatsapp-bot/bot.mjs, Betreiber 12.11.2026, Test).
#
# Startet jeden Abend zweimal (18:47 / 19:17 UTC, GitHub startet oft verspätet). Ohne
# Bazis-Spiel heute oder ohne WA_GRUPPE_LIVE endet der Lauf sofort, ohne sich bei WhatsApp
# anzumelden. Ein Lauf bleibt bis zum Endstand, höchstens 5 Stunden.
# Erste Nachricht frühestens 30 Min. vor Anwurf (Betreiber 13.11.2026): Lokal, Gegner, Anwurf und
# alle Zusagen aus dem Team Manager („Heute an der Scheibe“), geholt über /api/live/aufgebot.
# Teilt sich die Gruppe „bazis-bot“ mit der Umfrage: nie zwei Anmeldungen gleichzeitig.
#
# Von Hand: live (wie der Abendlauf) · live-test (bisherige Ergebnisse an dich selbst)
#   signal-anmelden — einmalig: Link im Protokoll als QR-Code mit Signal scannen (Konto muss WA_NUMMER sein)
#   signal-test     — Testnachricht per Signal an dich selbst
# SIGNAL (Betreiber 13.11.2026): Ist das Geheimnis SIGNAL_EMPFAENGER (Nummer +49…) gesetzt und angemeldet,
# geht jede Nachricht zusätzlich per Signal an diese EINE Person (scripts/whatsapp-bot/signal.mjs).
# Ohne Geheimnis wird signal-cli gar nicht erst installiert.
on:
  schedule:
    - cron: '47 18 * * *'
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      modus:
        description: 'Was soll der Bot tun?'
        type: choice
        options: [live, live-test, signal-anmelden, signal-test]
        default: live-test

concurrency:
  group: bazis-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  # GitHub-Ausweis (OIDC) für /api/live/aufgebot: Zusagen für die Startnachricht, ohne Geheimnis.
  id-token: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    env:
      MODUS: ${{ inputs.modus || 'live' }}
      SIGNAL_EMPFAENGER: ${{ secrets.SIGNAL_EMPFAENGER }}
      WA_GRUPPE_SPIEGEL: ${{ secrets.WA_GRUPPE_SPIEGEL }}
    steps:
      - name: Auf laufenden Spiegel-Lauf warten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bazis-spiegel.yml/runs?status=in_progress&per_page=1" | jq '.total_count' || echo 0)
            [ "${n:-0}" = "0" ] && exit 0
            echo "Spiegel-Lauf aktiv – warte 10 s"; sleep 10
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gespeicherte Anmeldung holen
        uses: actions/cache/restore@v4
        with:
          path: scripts/whatsapp-bot/sitzung
          key: wa-sitzung-none
          restore-keys: wa-sitzung-

      - name: Signal-Anmeldung (verschlüsselt) holen
        uses: actions/cache/restore@v4
        with:
          path: scripts/whatsapp-bot/signal
          key: signal-sitzung-none
          restore-keys: signal-sitzung-

      - name: signal-cli installieren (nur wenn Signal eingerichtet)
        if: env.SIGNAL_EMPFAENGER != '' || startsWith(env.MODUS, 'signal')
        continue-on-error: true
        run: |
          url=$(curl -fsSL https://api.github.com/repos/AsamK/signal-cli/releases/latest | jq -r '.assets[] | select(.name | test("Linux-native\\.tar\\.gz$")) | .browser_download_url' | head -1)
          echo "signal-cli: $url"
          mkdir -p "$RUNNER_TEMP/signal-cli" && curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP/signal-cli"
          bin=$(find "$RUNNER_TEMP/signal-cli" -type f -name signal-cli | head -1) && chmod +x "$bin"
          echo "SIGNAL_CLI=$bin" >> "$GITHUB_ENV" && "$bin" --version

      - name: Bot-Abhängigkeiten
        working-directory: scripts/whatsapp-bot
        run: npm ci --no-audit --no-fund

      - name: Bot
        working-directory: scripts/whatsapp-bot
        env:
          WA_SCHLUESSEL: ${{ secrets.WA_SCHLUESSEL }}
          WA_GRUPPE_LIVE: ${{ secrets.WA_GRUPPE_LIVE }}
          WA_SITZUNG: ${{ secrets.WA_SITZUNG }}
          WA_NUMMER: ${{ secrets.WA_NUMMER }}
        run: node bot.mjs "$MODUS"

      - name: Anmeldung (verschlüsselt) sichern
        if: always() && hashFiles('scripts/whatsapp-bot/sitzung/sitzung.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: scripts/whatsapp-bot/sitzung
          key: wa-sitzung-${{ hashFiles('scripts/whatsapp-bot/sitzung/sitzung.enc') }}

      - name: Signal-Anmeldung (verschlüsselt) sichern
        if: always() && hashFiles('scripts/whatsapp-bot/signal/signal.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: scripts/whatsapp-bot/signal
          key: signal-sitzung-${{ hashFiles('scripts/whatsapp-bot/signal/signal.enc') }}
